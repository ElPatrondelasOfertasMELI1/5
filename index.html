<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>El Patrón de las Ofertas</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="top">

 <div class="brand">

  <img
    src="./54012095-475D-41B9-
BEEC-7C0AA78DCF19.png"
    alt="El Patrón de las Ofertas"
    style="
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
    "
  >

  <div>
    <b>EL PATRÓN</b>
    <small>DE LAS OFERTAS</small>
  </div>

</div>

  <a
    id="whatsappHeader"
    class="wa"
    href="https://wa.me/"
    target="_blank"
    rel="noopener"
  >
    💬 WhatsApp
  </a>

</header>

<main>

  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero">

    <div>

      <span class="pill">
        🔥 OFERTAS DEL DÍA
      </span>

      <h1>
        Encuentra ofertas,<br>
        <strong>cupones y descuentos</strong>
      </h1>

      <p>
        Aprovecha promociones antes de que se terminen.
      </p>

    </div>

  </section>

  <!-- =====================================================
       CATEGORÍAS
  ====================================================== -->

  <nav
    class="categories"
    id="categories"
  ></nav>

  <!-- =====================================================
       OFERTAS
  ====================================================== -->

  <section class="section">

    <div class="section-title">

      <h2>
        🔥 Ofertas destacadas
      </h2>

      <a href="#">
        Ver todas →
      </a>

    </div>

    <div
      class="slider"
      id="offers"
    ></div>

  </section>

  <!-- =====================================================
       MERCADO PAGO
  ====================================================== -->

  <section
    class="mp-card"
    id="mercadopago"
  ></section>

  <!-- =====================================================
       CUPONES
  ====================================================== -->

  <section class="section">

    <div class="section-title">

      <h2>
        🎟️ Cupones
      </h2>

    </div>

    <div
      id="couponSections"
    ></div>

  </section>

</main>

<!-- =======================================================
     WHATSAPP FLOTANTE
======================================================== -->

<div class="wa-float">

  <a
    id="whatsappFloat"
    href="https://wa.me/"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
  >
    💬
  </a>

</div>

<!-- =======================================================
     FOOTER
======================================================== -->

<footer>
  ⚡ El Patrón de las Ofertas · Hecho para ahorrar
</footer>

<!-- =======================================================
     APP CON FIREBASE
======================================================== -->

<script
  type="module"
  src="app.js"
></script>

</body>
</html>
